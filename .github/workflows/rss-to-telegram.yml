name: YouTube RSS to Telegram
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
permissions:
  contents: write
concurrency:
  group: rss-telegram
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Post videos
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: '@CabareteVibes'
        run: python bot.py
      - name: Save posted IDs
        run: |
          if [ -f posted_videos.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add posted_videos.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update posted video IDs'
              git push
            fi
          fi
